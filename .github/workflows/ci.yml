name: ci

on:
  push:
  pull_request:

env:
  # Ordered fallbacks when automation-kit main lacks capability contracts (REQ-003).
  AUTOMATION_KIT_CAPABILITY_FALLBACK_REFS: docs/unified-development-20260718

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11"]
    defaults:
      run:
        working-directory: automation-app-dianping
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation-app-dianping
      - uses: actions/checkout@v4
        with:
          repository: dengyie/automation-kit
          path: automation-kit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install automation-kit with capability contracts
        run: |
          set -euo pipefail
          kit_root="../automation-kit"
          ensure_capabilities() {
            if [ -d "$kit_root/automation_core/capabilities" ]; then
              echo "Using automation-kit checkout with capability module at $(git -C "$kit_root" rev-parse --short HEAD)."
              return 0
            fi
            echo "Primary automation-kit checkout lacks automation_core.capabilities."
            git -C "$kit_root" fetch origin --prune
            IFS=' ' read -r -a refs <<< "${AUTOMATION_KIT_CAPABILITY_FALLBACK_REFS}"
            for ref in "${refs[@]}"; do
              [ -n "$ref" ] || continue
              echo "Trying fallback ref: $ref"
              if git -C "$kit_root" rev-parse --verify --quiet "origin/$ref" >/dev/null; then
                git -C "$kit_root" checkout -B "ci-kit-$ref" "origin/$ref"
              elif git -C "$kit_root" rev-parse --verify --quiet "$ref" >/dev/null; then
                git -C "$kit_root" checkout -B "ci-kit-local" "$ref"
              else
                echo "Fallback ref not found: $ref"
                continue
              fi
              if [ -d "$kit_root/automation_core/capabilities" ]; then
                echo "Capability module found on $ref ($(git -C "$kit_root" rev-parse --short HEAD))."
                return 0
              fi
            done
            echo "::error::automation-kit capability contracts unavailable. Publish automation-kit with automation_core.capabilities (REQ-003) or set AUTOMATION_KIT_CAPABILITY_FALLBACK_REFS."
            exit 1
          }
          ensure_capabilities
          python -m pip install -e "$kit_root"
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install "pytest>=8,<9" "pytest-cov>=5,<6"
      - run: python -m pytest -q

  slidex-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation-app-dianping
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation-app-dianping
      - uses: actions/checkout@v4
        with:
          repository: dengyie/automation-kit
          path: automation-kit
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: dengyie/slidex
          path: slidex
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure capability platform baseline
        run: |
          set -euo pipefail
          kit_root="../automation-kit"
          if [ -d "$kit_root/automation_core/capabilities" ]; then
            echo "Capability module present on primary checkout."
            exit 0
          fi
          git -C "$kit_root" fetch origin --prune
          IFS=' ' read -r -a refs <<< "${AUTOMATION_KIT_CAPABILITY_FALLBACK_REFS}"
          for ref in "${refs[@]}"; do
            [ -n "$ref" ] || continue
            if git -C "$kit_root" rev-parse --verify --quiet "origin/$ref" >/dev/null; then
              git -C "$kit_root" checkout -B "ci-kit-$ref" "origin/$ref"
            else
              continue
            fi
            if [ -d "$kit_root/automation_core/capabilities" ]; then
              echo "Using fallback $ref for capability contracts."
              exit 0
            fi
          done
          echo "::error::No automation-kit ref provides automation_core.capabilities (REQ-003)."
          exit 1
      - run: python -m pip install -e ../automation-kit
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install -e ../slidex
      - run: python -m pip install "pytest>=8,<9" "pytest-cov>=5,<6"
      - run: python -m pytest -q
