[project]
name = "automation-app-dianping"
version = "0.3.0"
description = "Dianping application workflows built on automation-kit"
authors = [{ name = "mango" }]
readme = "README.md"
requires-python = ">=3.8,<4.0"
# 兼容范围声明，不是「从包源可解析」的发布依赖：automation-kit 未上任何包源
# （PyPI 上无 automation-kit），本仓本地与 CI 的实际取用方式是 monorepo sibling 检出 +
# `pip install -e ../automation-kit`（见 [tool.poetry.dependencies] 的 path 依赖与 ci.yml），
# 这一行只记录本应用适配的 kit 版本区间，因此从不被包源解析。若将来 kit 上架，
# 本行即为可直接解析的依赖，无需改动。
dependencies = [
    "automation-kit>=0.5.0,<0.6.0",
    # pick_photos stages review images through PIL (EXIF rewrite, alpha flatten).
    # Python 3.8 resolves to Pillow 10.x via Requires-Python; no 3.9-only cap.
    "Pillow>=9,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
]
live = [
    "Appium-Python-Client>=4.0.0",
    "selenium>=4.0.0",
    "uiautomator2>=3,<4",
    "adbutils>=2.9.1",
]
# Optional visual provider. PyPI name `slidex` is an unrelated PPTX library;
# pin dengyie/slidex by git SHA. The environment marker is what keeps it off the
# 3.8 default CI job, and it is also required for `poetry lock` to resolve at
# all: without it the 3.10+ requirement contradicts requires-python ">=3.8".
slidex = [
    "slidex @ git+https://github.com/dengyie/slidex.git@288f554 ; python_version >= \"3.10\"",
]

# Local Poetry path dependency is developer convenience only.
# Packaging/build backend remains setuptools with [project] metadata.
[tool.poetry]
name = "automation-app-dianping"
version = "0.3.0"
description = "Dianping application workflows built on automation-kit"
authors = ["mango"]
readme = "README.md"
packages = [{ include = "automation_app_dianping" }]

[tool.poetry.dependencies]
python = "^3.8"
# Local monorepo checkout. Do not treat this as release metadata.
automation-kit = { path = "../automation-kit", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["automation_app_dianping*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=automation_app_dianping",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["automation_app_dianping"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/__main__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
