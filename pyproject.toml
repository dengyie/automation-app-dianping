[project]
name = "automation-app-dianping"
version = "0.3.0"
description = "Dianping application workflows built on automation-kit"
authors = [{ name = "mango" }]
readme = "README.md"
requires-python = ">=3.8,<4.0"
# Release / CI install surface: published version range only (no sibling path).
dependencies = [
    "automation-kit>=0.3.0,<0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
]

# Local Poetry path dependency is developer convenience only.
# Packaging/build backend remains setuptools with [project] metadata.
[tool.poetry]
name = "automation-app-dianping"
version = "0.3.0"
description = "Dianping application workflows built on automation-kit"
authors = ["mango"]
readme = "README.md"
packages = [{ include = "automation_app_dianping" }]

[tool.poetry.dependencies]
python = "^3.8"
# Local monorepo checkout. Do not treat this as release metadata.
automation-kit = { path = "../automation-kit", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["automation_app_dianping*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=automation_app_dianping",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["automation_app_dianping"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
